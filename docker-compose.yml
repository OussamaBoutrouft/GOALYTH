services:
  db:
    image: postgres:16-alpine
    container_name: goalyth_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: goalyth
      POSTGRES_PASSWORD: goalyth_dev_pwd
      POSTGRES_DB: goalyth
    ports:
      - "5433:5432"
    volumes:
      - goalyth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalyth -d goalyth"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: goalyth_redis
    restart: unless-stopped
    profiles: ["cache"]
    ports:
      - "6379:6379"
    volumes:
      - goalyth_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  goalyth_pgdata:
  goalyth_redisdata:
